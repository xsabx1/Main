
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e1e2f;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 320px;
            max-width: calc(100% - 30px);
            padding: 20px;
            background: #2d2d44;
            border-radius: 20px;
            box-shadow: 0 10px 30px #0005;
        }

        h2 {
            text-align: center;
            color: white;
        }

        #display {
            width: 100%;
            height: 70px;
            margin-bottom: 15px;
            padding: 10px;
            background: #171725;
            color: white;
            border: none;
            border-radius: 10px;
            text-align: right;
            font-size: 30px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 10px;
            background: #44445e;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.95);
        }

        .operator {
            background: #ff9500;
        }

        .clear {
            background: #e53935;
        }

        .equal {
            background: #2196f3;
            grid-column: span 2;
        }
    </style>
</head>

<body>

<div class="calculator">
    <h2>Калькулятор</h2>

    <input type="text" id="display" value="0" readonly>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="deleteNumber()">⌫</button>
        <button class="operator" onclick="chooseOperator('/')">÷</button>
        <button class="operator" onclick="chooseOperator('*')">×</button>

        <button onclick="addNumber('7')">7</button>
        <button onclick="addNumber('8')">8</button>
        <button onclick="addNumber('9')">9</button>
        <button class="operator" onclick="chooseOperator('-')">−</button>

        <button onclick="addNumber('4')">4</button>
        <button onclick="addNumber('5')">5</button>
        <button onclick="addNumber('6')">6</button>
        <button class="operator" onclick="chooseOperator('+')">+</button>

        <button onclick="addNumber('1')">1</button>
        <button onclick="addNumber('2')">2</button>
        <button onclick="addNumber('3')">3</button>
        <button onclick="addNumber('0')">0</button>

        <button onclick="addNumber('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById("display");

    let firstNumber = null;
    let operator = null;
    let newNumber = true;

    function addNumber(number) {
        if (newNumber) {
            display.value = number === "." ? "0." : number;
            newNumber = false;
        } else {
            if (number === "." && display.value.includes(".")) return;
            display.value += number;
        }
    }

    function chooseOperator(op) {
        firstNumber = Number(display.value);
        operator = op;
        newNumber = true;
    }

    function calculate() {
        if (operator === null || firstNumber === null) return;

        const secondNumber = Number(display.value);
        let result;

        switch (operator) {
            case "+":
                result = firstNumber + secondNumber;
                break;
            case "-":
                result = firstNumber - secondNumber;
                break;
            case "*":
                result = firstNumber * secondNumber;
                break;
            case "/":
                if (secondNumber === 0) {
                    display.value = "Ошибка";
                    operator = null;
                    firstNumber = null;
                    newNumber = true;
                    return;
                }
                result = firstNumber / secondNumber;
                break;
        }

        display.value = String(Number(result.toPrecision(12)));
        firstNumber = null;
        operator = null;
        newNumber = true;
    }

    function clearDisplay() {
        display.value = "0";
        firstNumber = null;
        operator = null;
        newNumber = true;
    }

    function deleteNumber() {
        if (newNumber) return;

        display.value = display.value.slice(0, -1);

        if (display.value === "") {
            display.value = "0";
            newNumber = true;
        }
    }
</script>

</body>
</html>
